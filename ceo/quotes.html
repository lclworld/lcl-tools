<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LCL Quote Generator</title>
<!-- CEO App: saving goes to the CEO Hub instead of artifact storage (see js/quotes-store.js). -->
<meta name="robots" content="noindex, nofollow">
<script src="config.js"></script>
<script src="js/quotes-store.js"></script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout concept: a quiet desk. Plain white form on the left with generous space, a soft peach board holding the live A4 quote on the right. Orange is used only for the one main action and the active choice. */
:root{
  --bg:#FAF4EE;--card:#FFFFFF; --fg:#2B201C; --mute:#8C766A; --line:#EFE3DA; --soft:#FBF3EC; --board:#F8E9DD;
  --brand:#5B4239; --orange:#FF914D; --peach:#FCD5B9; --taupe:#C4B8B4;
  --btn-bg:#FF914D; --btn-fg:#2E1608; --warn:#B4531A; --focus:#E8742A;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.top{display:flex;align-items:center;gap:44px;flex-wrap:wrap;padding-block:22px 6px;max-width:1240px;margin:0 auto}
.brandmark img{height:54px;display:block}
.tabs{display:flex;gap:28px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 0;cursor:pointer;color:var(--mute);font-weight:600}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--orange)}
#main,#banner{max-width:1240px;margin:0 auto}
#main{padding-block:28px 64px}
.btn{background:var(--btn-bg);color:var(--btn-fg);border:0;border-radius:6px;padding:11px 20px;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--brand);padding:8px 0;border-radius:0;font-weight:600;box-shadow:none;border-bottom:1px solid transparent}
.btn.ghost:hover{border-bottom-color:var(--brand)}
.btn.sm{font-size:13px}
.btn:not(.ghost).sm{padding:9px 16px}
.btn:disabled{opacity:.55;cursor:default}
.banner{color:var(--mute);font-size:12.5px;margin:12px 0}
.work{display:grid;grid-template-columns:minmax(0,500px) minmax(0,1fr);gap:56px;align-items:start}
.panel{min-width:0}
.sticky{position:sticky;top:8px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 22px;margin-bottom:20px;display:flex;gap:20px;flex-wrap:wrap;align-items:center}
.qn{font-weight:800;font-size:18px;margin-right:auto;font-variant-numeric:tabular-nums}
.qn small{display:block;font-size:11.5px;color:var(--mute);font-weight:500}
.sec{margin-bottom:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px 28px}
.sec h3{margin:0 0 20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:800;display:flex;align-items:center;gap:10px}.sec h3::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--orange)}
.row{display:flex;gap:24px;flex-wrap:wrap}
.row>*{flex:1 1 120px;min-width:0}
label.f{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mute);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:transparent;border:0;border-bottom:1px solid #E2D3C8;border-radius:0;padding:8px 0;color:var(--fg);font-weight:500;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--orange)}
textarea{min-height:96px;resize:vertical;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:10px;line-height:1.55}
textarea:focus{border-color:var(--orange)}
.seg{display:flex;gap:28px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:4px 0 6px;cursor:pointer;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;font-size:15px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--orange)}
.seg.small button{font-size:13px}
.chk{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;cursor:pointer;padding:5px 0}
.chk input{width:16px;height:16px;accent-color:var(--orange);flex:none}
.it{padding:18px 20px 16px;margin-bottom:14px;background:var(--bg);border-radius:10px}
.it .rw{display:flex;gap:20px;flex-wrap:wrap}
.it .rw>*{flex:1 1 90px;min-width:0}
.it .rw>.w2{flex:3 1 200px}
.it .as{font-size:12px;color:var(--mute);margin:8px 0 0}
.it .as b{color:var(--fg);font-weight:600}
.more{margin-top:16px;display:flex;flex-direction:column;gap:16px}
.bd .line{display:flex;gap:16px;margin-bottom:4px;align-items:center}
.bd .line select{flex:1.4}.bd .line input{flex:1}
.mini{font-size:12px;color:var(--mute);margin:6px 0 0}
.acc-wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 28px;margin-bottom:20px}
.acc+.acc{border-top:1px solid var(--line)}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:18px 0;cursor:pointer;text-align:left;font-weight:600;font-size:14px}
.acc-h .hint{margin-left:auto;font-size:12px;color:var(--mute);font-weight:500}
.acc-h i{width:8px;height:8px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:rotate(45deg);margin-left:6px;margin-bottom:3px;transition:transform .15s}
.acc-h[aria-expanded="true"] i{transform:rotate(-135deg);margin-bottom:-3px}
.acc-b{padding:0 0 24px}
.nt{padding:2px 0}
.board{background:var(--board);border-radius:4px;padding:28px 20px;display:flex;flex-direction:column;gap:20px;align-items:center;min-width:0}
.pvbox{position:relative;box-shadow:0 1px 2px rgba(90,62,54,.12),0 10px 30px -12px rgba(90,62,54,.3);background:#fff;max-width:100%}
.pvbox .page{position:absolute;left:0;top:0;transform-origin:top left}
.viewsw{display:none;margin-bottom:20px}
table.data{width:100%;border-collapse:collapse;font-size:13.5px}
table.data th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:10px 12px 10px 0;font-weight:700;border-bottom:1px solid var(--line)}
table.data td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.data td input,table.data td select{padding:4px 0}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 24px}
.pill{color:var(--warn);font-size:12px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:6px;font-weight:600;z-index:50;max-width:90vw}
#stage{position:absolute;left:-99999px;top:0;width:794px}
@media (max-width:980px){
  .work{grid-template-columns:minmax(0,1fr);gap:0}
  .viewsw{display:flex}
  .work[data-view="edit"] .prevcol{display:none}
  .work[data-view="prev"] .editcol{display:none}
}

/* ===== The quote itself (always white paper, A4 at 794 x 1123) ===== */
.page{width:794px;height:1123px;background:#fff;color:#2b2b2b;font-family:'Montserrat',sans-serif;position:relative;overflow:hidden;padding:62px 70px 0}
.page *{box-sizing:border-box}
.lg{display:flex;align-items:center;gap:8px;height:92px}
.lg svg{width:62px;height:90px}
.lg .wm{font-family:'Anton',sans-serif;line-height:.98;letter-spacing:.02em;text-transform:uppercase}
.lg .wm i{display:block;font-style:normal}
.lg img{height:92px;max-width:340px;object-fit:contain}
.pg-title{font-weight:800;font-size:78px;letter-spacing:-.01em;color:#1e1e1e;line-height:1;margin:14px 0 26px;text-transform:uppercase}
.pg-note{font-weight:800;font-size:56px;color:#1e1e1e;text-align:center;margin:30px 0 22px;text-transform:uppercase}
.meta{font-size:16px;line-height:1.5}
.meta b{font-weight:700}
.issued{margin-top:16px;font-size:16px}
.issued b{display:block;font-weight:700}
.qt{width:100%;border-collapse:collapse;margin-top:28px;font-size:15px}
.qt th{background:#E5E5E7;font-weight:500;text-align:left;padding:14px 18px;font-size:15px}
.qt th.n,.qt td.n{text-align:right}
.qt td{padding:9px 18px;vertical-align:top}
.qt tbody tr:first-child td{padding-top:20px}
.qt td.nm{padding-left:26px}
.qt .bdn{display:block;font-size:11px;color:#777;margin-top:3px}
.qt tr.grp td{font-weight:700;padding:22px 18px 6px 18px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#5B4239}
.qt tr.tot td{font-weight:700;border-top:2px solid #222;padding-top:14px}
.foot{margin-top:26px;font-size:13px;font-style:italic;font-weight:600;line-height:1.6;color:#1e1e1e}
.nbody{height:690px;overflow:hidden;font-size:14.5px;line-height:1.75}
.nsec{margin-bottom:18px}
.nsec h4{margin:0 0 4px;font-size:15px;font-weight:700;color:#1e1e1e}
.nsec ul{margin:0;padding-left:26px}
.nsec li{margin-bottom:2px}
.nsec p{margin:0 0 4px}
.nsec p.bold{font-weight:700}
.pay{font-size:16px;line-height:1.55;margin-top:56px}
.pay h4{font-size:16px;font-weight:700;margin:0 0 22px}
.pay .blk{margin-bottom:24px}
.pay .blk u{display:block;margin-bottom:2px}
.pay .nt2{display:flex;gap:40px;margin-top:20px}
.pay .nt2 b{font-weight:800}
.waves{position:absolute;left:0;bottom:0;width:794px;height:150px;max-width:none!important}
</style>

(function(){

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,dl=null,tab='quote',view='edit';

let settings={rate:10,months:3,rep:'',logo:'',nt:{}};

const SERVICES=['Development','Formula Rights','Sample Only Development','Essential Formula Development','Comprehensive Formula Development'];
const PREFIX_SV=['Sample Only Development','Essential Formula Development','Comprehensive Formula Development'];
const BD_CATS=['Raw materials','Packaging','Labels and printing','Filling and handling','Production labour','Quality control','Shipping and logistics','Formulation and development','Other'];

/* ---------- Notice library, grouped by mode ---------- */
const NDEF=[
 // PRODUCTION
 {id:'p-time',m:['production'],t:'Timeline',x:"Standard production time is 10 to 15 working days, excluding weekends and public holidays.\nThe timeline starts after payment is confirmed and any client supplied packaging or ingredients have arrived at our facility.\nLarge orders (over 500L or 2,000 units) take 4 to 6 weeks.\nIf an extended timeline is required (for example, due to ingredient sourcing), this will be communicated in advance.\nWe currently do not offer express production. All products follow our standard timelines to maintain consistency and quality.\nShipping costs and timelines vary based on package size, destination, and courier rates. Shipping is quoted separately."},
 {id:'p-sched',m:['production'],t:'Production Schedule',x:"Our production schedule is updated monthly and shared via email newsletter and on our Instagram page.\nSome months may be fully booked and new orders will be scheduled based on next availability. Clients are encouraged to place orders in advance to secure production slots."},
 {id:'p-pack',m:['production'],t:'Packaging and Pre-Filling',x:"Clients may provide their own packaging, but it must be approved by Lueur for compatibility and product stability.\nIf Lueur sources packaging, client approval is required before production starts.\nAll client supplied packaging must be submitted at least 5 business days before production begins.\nClients can provide printed labels, or request for labels to be printed.\nIf the provided packaging is unsuitable or compromises product stability, we will recommend alternatives before proceeding with production."},
 {id:'p-pay',m:['production'],t:'Payment',x:"Full payment is required before production begins. A 60% deposit is required to start order processing and the remaining amount must be completed before production begins.\nOnce production has started, payments are non-refundable.\nAll prices are subject to review and may be adjusted in response to inflation or changes in production costs.\nPrices stated are inclusive of handling and filling fees. Shipping fees are quoted separately."},
 {id:'p-chg',m:['production'],t:'Changes to Order',x:"~Changes requested before production may:\nIncur additional costs\nExtend the timeline depending on ingredient or packaging adjustments\nChanges cannot be made once production has started."},
 {id:'p-can',m:['production'],t:'Cancellation',x:"~If cancellation occurs before production begins:\nA partial refund (between 40 to 60%) may be issued based on sourcing status.\nIf ingredients have already been purchased, refunds will be capped at 40% or less."},
 {id:'p-pid',m:['production'],t:'What You Receive',x:"Every order is delivered with a Product Information Document (PID): a full INCI listing and product specification sheet to support safe handling, accurate labelling, and marketing claims for your brand."},
 {id:'p-agree',m:['production'],t:'',x:"!By making payment, you confirm that you have read, understood, and agreed to the policies outlined above."},
 // SAMPLE
 {id:'s-time-pl',m:['sample'],sub:'private',t:'Timeline',x:"Private label samples are processed within 5 to 10 working days after payment.\nShipping costs and timelines vary based on package size, destination, and courier rates. Shipping is quoted separately."},
 {id:'s-time-cu',m:['sample'],sub:'custom',t:'Timeline',x:"Custom samples take 15 to 20 working days to be delivered after 100% payment has been made.\nShipping costs and timelines vary based on package size, destination, and courier rates. Shipping is quoted separately."},
 {id:'s-purpose',m:['sample'],t:'Purpose',x:"~Samples are made to your specifications for approval and feedback, and are normally packaged in our standard sample packaging."},
 {id:'s-fee',m:['sample'],t:'Sample Fees',x:"Sample fees are non-refundable.\nSample prices differ from standard production unit prices.\nPrices stated are inclusive of handling and filling fees."},
 {id:'s-sel',m:['sample'],sub:'custom',t:'Sample Selection',x:"~After reviewing the samples, the client will select one preferred option for finalisation. One revision of the chosen formula is permitted. Any further revisions will be considered a new development request and will incur additional charges."},
 {id:'s-pay',m:['sample'],t:'Payment',x:"Full payment is required before sample production begins.\nAll prices are subject to review and may be adjusted in response to inflation or changes in production costs."},
 {id:'s-agree',m:['sample'],t:'',x:"!By making payment, you confirm that you have read, understood, and agreed to the policies outlined above."},
 // SERVICES
 {id:'v-tier-s',m:['services'],svc:['Sample Only Development'],t:'Sample Only Development',x:"~For those who just want to test a product without long term commitments.\nIncludes 1 custom made sample tailored to your specifications\nIncludes 1 minor reiteration (if necessary)\nProduct only shipped directly to you\nNo rights or documentation to the formula are included.\nThis service is for testing purposes or personal use only."},
 {id:'v-tier-e',m:['services'],svc:['Essential Formula Development'],t:'Essential Formula Development',x:"~For brands who want to develop a strong product with guided support, without the cost of owning the full formula rights.\n2 distinct sample versions to help you choose the best fit\n1 reiteration (if needed)\nSupport during formula development\nPartial technical documentation for production continuity\nProduction can only be done through our lab under this tier"},
 {id:'v-tier-c',m:['services'],svc:['Comprehensive Formula Development'],t:'Comprehensive Formula Development',x:"~Ideal for established brands that want full ownership of their product and IP.\nMultiple initial sample versions for testing\nUp to 2 reiterations during a 3 month development period\nFull formula documentation (INCI list, procedure, ingredient breakdown, etc.)\nFull legal rights to the formula under contract\nYou gain complete ownership and can choose to manufacture with us or independently\nWe are contractually restricted from reproducing this formula for any other entity"},
 {id:'v-purpose',m:['services'],svc:['Development'],t:'Purpose',x:"~Three sample options of each product are developed with the sole focus on product formula, efficacy, and matching client specifications. Samples are normally packaged in our standard sample packaging."},
 {id:'v-time',m:['services'],svc:['Development','Sample Only Development','Essential Formula Development','Comprehensive Formula Development'],t:'Timeline',x:"~Samples may take 15 to 20 working days to be delivered after 100% payment has been made."},
 {id:'v-sel',m:['services'],svc:['Development'],t:'Sample Selection',x:"~After reviewing the samples, the client will select one preferred option for finalisation. One revision of the chosen formula is permitted. Any further revisions will be considered a new development request and will incur additional charges."},

/* ---------- State ---------- */
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const blankItem=()=>({k:'sample',name:'',q:'',size:'',min:'',unit:'',qty:'',usd:'',bd:[],open:false});
const presetCols=m=>m==='services'?{size:false,min:false,qty:false,total:false}:{size:true,min:true,qty:false,total:false};
function newState(){
  const nt={};NDEF.forEach(n=>{nt[n.id]={on:true,x:(settings.nt&&settings.nt[n.id])||n.x}});
  return {id:null,seq:null,status:'Open',mode:'production',sub:'private',service:'Development',date:today(),
    client:'',country:'Ghana',rep:settings.rep||'',usd:false,cols:presetCols('production'),items:[blankItem()],showBd:false,
    extra:'',foot:{valid:true,incl:false},nt,pay:{ghs:true,usd:true,momo:true,paystack:true}};
}
let S=newState();

/* ---------- Helpers ---------- */
function fmt(n){const v=Number(n);if(n===''||n==null||!isFinite(v))return '';return Number.isInteger(v)?v.toLocaleString('en-US'):v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function dLong(iso){const d=new Date(iso+'T00:00:00');return isNaN(d)?'':d.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}
function addMonths(iso,n){const d=new Date(iso+'T00:00:00');d.setMonth(d.getMonth()+Number(n||3));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const kindOf=it=>S.mode==='both'?(it.k==='production'?'production':'sample'):S.mode;
function dn(it){
  const base=((it.q?it.q.trim()+' ':'')+(it.name||'').trim()).trim();if(!base)return '';
  if(kindOf(it)==='sample')return /sample$/i.test(base)?base:base+' Sample';
  if(S.mode==='services')return PREFIX_SV.includes(S.service)?S.service+' for '+base:base+' '+S.service;
  return base;
}
const rate=()=>Number(settings.rate)||10;
const usdOf=it=>it.usd!==''&&it.usd!=null?Number(it.usd):Math.ceil((Number(it.unit)||0)/rate());
const qtyOf=it=>Number(it.qty)||1;
function totals(){let g=0,u=0;S.items.forEach(it=>{if(it.unit===''&&it.name==='')return;g+=(Number(it.unit)||0)*qtyOf(it);u+=usdOf(it)*qtyOf(it)});return {g,u}}
function nextNo(){const m=logRows.length?Math.max(...logRows.map(r=>r.seq||0)):0;return Math.max(m,BASE)+1}
const numLabel=()=>'LCL-'+(S.seq||nextNo());
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>e.hidden=true,3200)}
function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}
function catOf(name){const it=(book.items||[]).find(x=>x.n.toLowerCase()===String(name).trim().toLowerCase());return it?{it,cat:(book.cats||{})[it.c]||{}}:null}
function applicable(n){
  if(S.mode==='both'){if(n.id==='s-agree')return false;return (n.m.includes('sample')||n.m.includes('production'))&&(!n.sub||n.sub===S.sub)}
  return n.m.includes(S.mode)&&(!n.sub||n.sub===S.sub)&&(!n.svc||n.svc.includes(S.service))}
const BOTH_T={'s-time-pl':'Sample Timeline','s-time-cu':'Sample Timeline','s-pay':'Sample Payment','p-time':'Production Timeline','p-pay':'Production Payment'};
const ntTitle=n=>S.mode==='both'&&BOTH_T[n.id]?BOTH_T[n.id]:n.t;
const ntRank=n=>n.id==='p-agree'?2:(n.m.includes('sample')?0:1);

async function saveQuote(quiet){
  if(!db){toast('Saving is not available in this view');return false}
  try{
    if(!S.seq){
      const ref=db.doc('meta/numbering');
      const r=await ref.acquire({holder:'q'+Math.random().toString(36).slice(2),ttlMs:8000});
      if(!r.acquired){toast('Another save is in progress, try again in a moment');return false}
      const snap=await db.collection('quotes').orderBy('seq','desc').limit(1).get();
      const max=snap.empty?BASE:(snap.docs[0].data().seq||BASE);
      S.seq=Math.max(max,BASE)+1;S.id='q'+S.seq;
    }
    await db.doc('quotes/'+S.id).set(payload());
    if(!quiet)toast('Saved as '+numLabel());
    const q=$('#qnum');if(q)q.textContent=numLabel();
    return true;
  }catch(e){S.seq=S.seq&&logRows.find(r=>r.seq===S.seq)?S.seq:null;S.id=S.seq?S.id:null;toast('Could not save: '+(e&&e.message||'unknown error'));return false}
}

  if(!window.html2canvas||!window.jspdf){toast('PDF tools are still loading, try again');return}
  busy=true;const b=$('#pdfbtn');if(b){b.disabled=true;b.textContent='Preparing...'}
  try{
    if(db){const ok=await saveQuote(true);if(!ok){busy=false;if(b){b.disabled=false;b.textContent='Download PDF'}return}}
    refresh();

    refresh();return;
  }
  if(tab==='log'&&t.dataset.st&&e.type==='change'){const r=logRows.find(x=>x.id===t.dataset.st);if(r&&db){db.doc('quotes/'+r.id).update({status:t.value,'state':Object.assign({},r.state,{status:t.value})}).catch(()=>toast('Could not update status'))}return}
  if(tab==='book'){
    const d=t.dataset;
    if(t.id==='bq'){bookQ=t.value;$('#btab tbody').innerHTML=bookRows();return}
    if(d.cm!=null){book.cats[d.cm].moq=t.value;saveBook()}
    if(d.cs!=null){book.cats[d.cs].samples=t.value.split(',').map(x=>x.split('=')).filter(a=>a[0]&&a[1]).map(a=>({s:a[0].trim(),f:Number(a[1])||0}));saveBook()}
    if(d.bn!=null){book.items[+d.bn].n=t.value;saveBook()}
    if(d.bc!=null){book.items[+d.bc].c=t.value;saveBook()}
    if(d.bp!=null){book.items[+d.bp].p=t.value===''?null:Number(t.value);saveBook()}
    return;
  }
  if(tab==='set'){
    if(t.id==='s-rate'){settings.rate=Number(t.value)||10;saveSettings()}
    if(t.id==='s-months'){settings.months=Math.max(1,Number(t.value)||3);saveSettings()}
    if(t.id==='s-rep'){settings.rep=t.value;saveSettings()}
    if(t.id==='s-logo'&&e.type==='change'&&t.files[0]){const f=t.files[0];if(f.size>150000){toast('Logo is over 150 KB, please use a smaller file');return}const r=new FileReader();r.onload=()=>{settings.logo=r.result;saveSettings();renderSet();toast('Logo updated')};r.readAsDataURL(f)}
  }
}
function autofill(i){
  const it=S.items[i],m=catOf(it.name);if(!m)return;
  if(it.min===''&&S.mode!=='services')it.min=m.cat.moq||'';
  if(kindOf(it)==='sample'){const s=(m.cat.samples||[])[0];if(s){if(it.size==='')it.size=s.s;if(it.unit==='')it.unit=s.f}}
  else if(kindOf(it)==='production'){if(it.unit===''&&m.it.p!=null)it.unit=m.it.p}
}
function syncItem(i){const it=S.items[i];['size','min','unit'].forEach(f=>{const el=document.querySelector('[data-k="items.'+i+'.'+f+'"]');if(el&&el!==document.activeElement)el.value=it[f]});const b=document.querySelector('[data-asfor="'+i+'"]');if(b)b.textContent=dn(it)||'...'}
function sizeFee(i){
  const it=S.items[i];if(kindOf(it)!=='sample')return;const m=catOf(it.name);if(!m)return;
  const s=(m.cat.samples||[]).find(x=>x.s.toLowerCase()===String(it.size).trim().toLowerCase());if(s){it.unit=s.f;syncItem(i)}
}
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const [a,x,y]=b.dataset.act.split(':');
  if(a==='view'){view=x;const w=$('.work');if(w)w.dataset.view=x;document.querySelectorAll('.viewsw button').forEach(q=>q.setAttribute('aria-pressed',String(q.dataset.act==='view:'+x)));if(x==='prev')refresh();return}
  if(a==='mode'){S.mode=x;S.cols=presetCols(x);rerenderForm();return}
  if(a==='sub'){S.sub=x;rerenderForm();return}
  if(a==='kind'){S.items[+x].k=y;rerenderForm();refresh();return}
  if(a==='add'){S.items.push(blankItem());rerenderForm();return}
  if(a==='del'){S.items.splice(+x,1);rerenderForm();return}
  if(a==='bd'){const it=S.items[+x];it.open=!it.open;rerenderForm();return}
  if(a==='sec'){openSec.has(x)?openSec.delete(x):openSec.add(x);rerenderForm();return}
  if(a==='nted'){openNt.has(x)?openNt.delete(x):openNt.add(x);rerenderForm();return}
  if(a==='addbd'){S.items[+x].bd.push({c:'Raw materials',a:''});rerenderForm();return}
  if(a==='delbd'){S.items[+x].bd.splice(+y,1);rerenderForm();return}
  if(a==='save'){await saveQuote();rerenderForm();return}
  if(a==='pdf'){exportPdf();return}
  if(a==='new'){S=newState();rerenderForm();return}
  if(a==='defwords'){
    if(!db){toast('Saving is not available in this view');return}
    const o={};NDEF.forEach(n=>{if(S.nt[n.id].x!==n.x)o[n.id]=S.nt[n.id].x});settings.nt=Object.assign({},settings.nt||{},o);
    try{await db.doc('settings/main').set(settings);toast('Wording saved as the default')}catch(err){toast('Could not save wording')}return}
  if(a==='open'){loadQuote(x,false);return}
  if(a==='dup'){loadQuote(x,true);return}
  if(a==='bookadd'){const c=Object.keys(book.cats||{})[0]||'';book.items.unshift({n:'New product',c,p:null});bookQ='';renderBook();saveBook();renderPlist();return}
  if(a==='bookdel'){book.items.splice(+x,1);renderBook();saveBook();renderPlist();return}
  if(a==='logoclear'){settings.logo='';saveSettings();renderSet();return}
});
document.addEventListener('focusout',e=>{if(tab==='book'&&e.target.dataset&&(e.target.dataset.bn!=null))renderPlist()});

/* ---------- Boot ---------- */
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(tab==='quote')refresh()});
(async()=>{
  try{dl=await claude.use('downloads')}catch(e){dl=null}
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){$('#banner').innerHTML='<div class="banner">Saving, the quote log and the price book need a signed in view. You can still build and preview quotes here.</div>';return}
  db.doc('settings/main').onSnapshot(s=>{if(s.exists){const d=s.data();settings=Object.assign({rate:10,months:3,rep:'',logo:'',nt:{}},d);if(!settings.nt)settings.nt={};
      if(tab==='quote'&&!S.seq&&S.items.length===1&&!S.items[0].name){const fresh=newState();NDEF.forEach(n=>{if(S.nt[n.id].x===n.x||true)S.nt[n.id].x=fresh.nt[n.id].x});if(!S.rep)S.rep=settings.rep;}
      if(tab==='quote'&&!document.activeElement.closest('#form'))rerenderForm();if(tab==='set'&&!document.activeElement.closest('#main'))renderSet()}},()=>{});
  db.doc('book/main').onSnapshot(s=>{if(s.exists){const d=s.data();book={items:d.items||[],cats:d.cats||{}};renderPlist();if(tab==='book'&&!document.activeElement.closest('#main'))renderBook()}},()=>{});
  db.collection('quotes').orderBy('seq','desc').limit(300).onSnapshot(snap=>{logRows=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(tab==='log'&&!(document.activeElement&&document.activeElement.closest('#main')))renderLog();if(tab==='quote'){const q=$('#qnum');if(q)q.textContent=numLabel()}},()=>{});
})();
})();
</script>

</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCL Email Follow-Up — Review Queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9;
    --card: #ffffff;
    --border: #e7e5e4;
    --text: #1c1917;
    --text-muted: #78716c;
    --accent: #0f766e;
    --accent-soft: #ccfbf1;
    --warn: #b45309;
    --warn-soft: #fef3c7;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 40px 24px 80px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  header .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  header h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  header .meta {
    font-size: 14px;
    color: var(--text-muted);
  }
  .summary-bar {
    display: flex;
    gap: 24px;
    margin: 20px 0 36px;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .summary-item .num { font-size: 22px; font-weight: 800; }
  .summary-item .label { font-size: 12px; color: var(--text-muted); font-weight: 500; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 16px;
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .card-id {
    font-weight: 800;
    font-size: 15px;
    color: var(--accent);
    flex-shrink: 0;
  }
  .card-subject {
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 2px;
  }
  .card-from {
    font-size: 13px;
    color: var(--text-muted);
  }
  .status-tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status-new { background: var(--accent-soft); color: var(--accent); }
  .status-refined { background: #e0e7ff; color: #3730a3; }
  .status-input { background: var(--warn-soft); color: var(--warn); }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 14px 0 4px;
  }
  .their-message {
    font-size: 14px;
    color: var(--text-muted);
    border-left: 2px solid var(--border);
    padding-left: 12px;
  }
  .draft-text {
    font-size: 14.5px;
    white-space: pre-wrap;
    background: #fbfaf9;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }

  footer {
    margin-top: 40px;
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
  }

  /* ---- No drafts state ---- */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">LCL · Email Follow-Up</div>
      <h1>Review Queue</h1>
      <div class="meta" id="run-meta">Run time —</div>
    </header>

    <div class="summary-bar" id="summary-bar">
      <!-- filled by data -->
    </div>

    <div id="cards">
      <!-- One .card per draft, generated from data below -->
    </div>

    <footer>Reply in chat to approve, edit, or hold any item — reference it by number (e.g. "approve #1 and #2").</footer>
  </div>

<script>
// ---------------------------------------------------------------
// DATA — replace this array with the actual queued drafts each run.
// status: "new" | "refined" | "input"
// ---------------------------------------------------------------
const DRAFTS = [
  {
    id: 1,
    subject: "Private Label pricing for a body butter line",
    from: "jane.doe@example.com",
    status: "new",
    theirMessage: "Hi, I am launching a body butter line and want to understand your Private Label MOQ and sample pricing.",
    draftText: "Hi Jane,

Thanks for reaching out! For Private Label, our MOQ is bulk-volume based -- body care starts from 2 litres. A 100g/100ml sample is GHS 450, and a 250ml sample is GHS 750.

To move forward, please fill out our Product Development Brief so we can scope your project and confirm pricing.

Best,
LCL Team"
  },
  {
    id: 2,
    subject: "FDA registration timeline",
    from: "kwame@brandco.com",
    status: "new",
    theirMessage: "How long does FDA registration take once you submit on our behalf?",
    draftText: "Hi Kwame,

Great question -- FDA registration is a separate add-on from manufacturing. We offer regular and fast-track processing; happy to share exact turnaround once we confirm which tier fits your timeline.

Best,
LCL Team"
  },
  {
    id: 3,
    subject: "Custom tube size request",
    from: "amara@glowbrand.com",
    status: "input",
    theirMessage: "Can we get a 150ml tube for our new serum?",
    draftText: "[KB doesn't cover current tube size availability with certainty -- last known info said 150ml was not readily available (50ml/100ml/200ml were). Needs your confirmation before sending.]"
  }
];
const RUN_TIME_LABEL = "Aug 19, 2026 · 3:00 PM run"; // e.g. "Aug 19, 2026 · 3:00 PM run"

function statusMeta(status) {
  if (status === "refined") return { cls: "status-refined", label: "Refined" };
  if (status === "input") return { cls: "status-input", label: "Needs your input" };
  return { cls: "status-new", label: "New" };
}

function render() {
  document.getElementById("run-meta").textContent = RUN_TIME_LABEL
    ? RUN_TIME_LABEL
    : "Run time —";

  const summaryBar = document.getElementById("summary-bar");
  const needsInput = DRAFTS.filter(d => d.status === "input").length;
  summaryBar.innerHTML = `
    <div class="summary-item"><div class="num">${DRAFTS.length}</div><div class="label">Awaiting review</div></div>
    <div class="summary-item"><div class="num">${needsInput}</div><div class="label">Need your input</div></div>
  `;

  const cardsEl = document.getElementById("cards");
  if (DRAFTS.length === 0) {
    cardsEl.innerHTML = `<div class="empty">Nothing needs a response right now.</div>`;
    return;
  }
  cardsEl.innerHTML = DRAFTS.map(d => {
    const sm = statusMeta(d.status);
    return `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="card-subject"><span class="card-id">#${d.id}</span> ${d.subject}</div>
            <div class="card-from">${d.from}</div>
          </div>
          <div class="status-tag ${sm.cls}">${sm.label}</div>
        </div>
        <div class="section-label">Their message</div>
        <div class="their-message">${d.theirMessage}</div>
        <div class="section-label">Drafted reply</div>
        <div class="draft-text">${d.draftText}</div>
      </div>
    `;
  }).join("");
}
render();
</script>
</body>
</html>
